fill="#325267" opacity="0.38" r="1.7" /><circle cx="103" cy="515" fill="#325267" opacity="0.38" r="1.0" /><circle cx="266" cy="612" fill="#325267" opacity="0.38" r="1.35" /><circle cx="429" cy="89" fill="#325267" opacity="0.38" r="1.7" /><circle cx="592" cy="186" fill="#325267" opacity="0.38" r="1.0" /><circle cx="755" cy="283" fill="#325267" opacity="0.38" r="1.35" /><circle cx="918" cy="380" fill="#325267" opacity="0.38" r="1.7" /><text fill="#eaf3fa" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="52" y="56">ДВА РАЗНЫХ КРИТЕРИЯ УСПЕХА</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="53" y="86">Lossless архивы и нейросетевые веса требуют принципиально разных доказательств</text><line stroke="#28465b" stroke-width="1" x1="51" x2="1230" y1="105" y2="105" /><rect fill="#102439" height="350" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="545" x="60" y="160" /><rect fill="#80e6ab" height="350" rx="3" width="6" x="60" y="160" /><text fill="#80e6ab" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="80" y="192">LOSSLESS / точные байты</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="80" y="224">Восстановление каждого байта</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="80" y="248">SHA256(source) = SHA256(restored)</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="80" y="272">Размер архива, скорость, память</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="80" y="296">Выборочная распаковка и устойчивость</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="80" y="320">Статус: есть точные замеры на корпусах</text><rect fill="#102439" height="350" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="545" x="676" y="160" /><rect fill="#ff858d" height="350" rx="3" width="6" x="676" y="160" /><text fill="#ff858d" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" x="696" y="192">LOSSY / веса нейросети</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="696" y="224">bit-per-weight и память</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="696" y="248">Tensor cosine / NMSE / activation L2</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="696" y="272">Full model perplexity и accuracy</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="696" y="296">Tokens/sec и качество после декодирования</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="696" y="320">Статус: DWE не прошёл; PQ/RVQ не готов</text><text fill="#ffc66e" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" text-anchor="middle" x="641" y="335">≠</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" x="56" y="594">Сжатие checkpoint в 40× не означает 40× меньше RAM и не означает сохранённую точность модели.</text></svg>