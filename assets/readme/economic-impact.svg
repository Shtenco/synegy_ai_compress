fill="#325267" opacity="0.38" r="1.7" /><circle cx="103" cy="515" fill="#325267" opacity="0.38" r="1.0" /><circle cx="266" cy="612" fill="#325267" opacity="0.38" r="1.35" /><circle cx="429" cy="89" fill="#325267" opacity="0.38" r="1.7" /><circle cx="592" cy="186" fill="#325267" opacity="0.38" r="1.0" /><circle cx="755" cy="283" fill="#325267" opacity="0.38" r="1.35" /><circle cx="918" cy="380" fill="#325267" opacity="0.38" r="1.7" /><text fill="#eaf3fa" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" x="52" y="56">Экономика хранения и передачи</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="53" y="86">Почему даже умеренная экономия может быть полезнее рекордного ratio</text><line stroke="#28465b" stroke-width="1" x1="51" x2="1230" y1="105" y2="105" /><rect fill="#102439" height="155" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="555" x="65" y="150" /><rect fill="#59e6e2" height="155" rx="3" width="6" x="65" y="150" /><text fill="#59e6e2" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="85" y="182">STORAGE</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="85" y="214">Хранилище / бэкапы</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="85" y="238">Стоимость / ГБ·месяц</text><rect fill="#102439" height="155" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="555" x="675" y="150" /><rect fill="#b7a5ff" height="155" rx="3" width="6" x="675" y="150" /><text fill="#b7a5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="695" y="182">NETWORK</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="695" y="214">Передача / репликация</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="695" y="238">Время / egress / связь</text><rect fill="#102439" height="155" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="555" x="65" y="336" /><rect fill="#80e6ab" height="155" rx="3" width="6" x="65" y="336" /><text fill="#80e6ab" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="85" y="368">ENERGY</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="85" y="400">CPU/GPU и серверы</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="85" y="424">Джоуль на полезный ГБ</text><rect fill="#102439" height="155" rx="14" ry="14" stroke="#28465b" stroke-width="1.5" width="555" x="675" y="336" /><rect fill="#ffc66e" height="155" rx="3" width="6" x="675" y="336" /><text fill="#ffc66e" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" x="695" y="368">MODEL SERVING</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="695" y="400">VRAM / задержка</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="695" y="424">Качество + tokens/s</text><text fill="#eaf3fa" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="640" y="564">TCO = STORAGE + NETWORK + CPU + OPERATIONS + RISK</text><text fill="#97aec2" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" x="56" y="603">Экономические эффекты измеряются на workload; коэффициент сжатия сам по себе не определяет ROI.</text></svg>