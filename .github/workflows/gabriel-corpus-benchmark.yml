name: Gabriel Horn corpus benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      size:
        description: Bytes per built-in dataset
        required: false
        default: '16384'
      repeats:
        description: Measured repetitions
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  public-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt
      - name: Install pinned dependencies
        run: python -m pip install -r compression_lab/requirements_v4.txt
      - name: Compile benchmark and engines
        run: |
          python -m py_compile \
            compression_lab/benchmark_gabriel_corpus.py \
            compression_lab/gabriel_horn_engine.py \
            compression_lab/shtenco_tier1_engines.py
      - name: Unit tests
        run: |
          python -m pytest -q \
            compression_lab/test_benchmark_gabriel_corpus.py \
            compression_lab/test_gabriel_horn_engine.py \
            compression_lab/test_tier1_engines.py
      - name: Exact public-engine corpus benchmark
        run: |
          SIZE="${{ github.event.inputs.size || '4096' }}"
          REPEATS="${{ github.event.inputs.repeats || '1' }}"
          python compression_lab/benchmark_gabriel_corpus.py \
            --size "$SIZE" \
            --repeats "$REPEATS" \
            --warmups 0 \
            --random-queries 5 \
            --random-bytes 512 \
            --datasets english_text,numeric_smooth_i32,versioned_blocks,seeded_random \
            --engines raw,gabriel-max,zstd-19,brotli-11,graal-igc \
            --output compression_lab/output_gabriel_public \
            --fail-fast
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: GABRIEL_HORN_PUBLIC_CORPUS
          path: compression_lab/output_gabriel_public/
          if-no-files-found: error
          retention-days: 30
