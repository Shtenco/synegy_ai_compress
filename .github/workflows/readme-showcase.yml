name: README / SVG validation
on:
  push:
    paths: [README.md, 'assets/readme/**', 'docs/**', 'scripts/check_readme.py']
  pull_request:
    paths: [README.md, 'assets/readme/**', 'docs/**', 'scripts/check_readme.py']
permissions:
  contents: read
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_readme.py