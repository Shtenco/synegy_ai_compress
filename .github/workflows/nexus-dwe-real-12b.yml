name: NEXUS DWE real 12B benchmark

on:
  push:
    branches: [main]
    paths:
      - 'compression_lab/nexus_dwe_real_12b.py'
      - '.github/workflows/nexus-dwe-real-12b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn brotli zstandard mnemonic
      - name: Compile benchmark
        run: python -m py_compile compression_lab/nexus_dwe_real_12b.py
      - name: Benchmark official Mistral-Nemo 12B BF16 weight ranges
        run: |
          python compression_lab/nexus_dwe_real_12b.py \
            --rows 384 \
            --ks 16 32 64 128 \
            --max-tensors 8 \
            --out-json benchmarks/NEXUS_DWE_REAL_12B.json \
            --out-md benchmarks/NEXUS_DWE_REAL_12B.md
      - name: Commit benchmark evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/NEXUS_DWE_REAL_12B.json benchmarks/NEXUS_DWE_REAL_12B.md
          if git diff --cached --quiet; then
            echo 'No benchmark changes to commit.'
          else
            git commit -m 'Record real Mistral-Nemo 12B DWE benchmark'
            git push
          fi
