name: Consolidate long121 exact benchmark into one evidence table
on:
  workflow_run:
    workflows: ["Long 81 SYNERGY + WORLD40 full benchmark (30x timeouts)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Long benchmark workflow run ID to aggregate"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  merge-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download every available raw shard (including unsuccessful benchmark runs)
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p long121_artifacts
          RUN_ID="${TRIGGER_RUN_ID:-${MANUAL_RUN_ID}}"
          echo "Collecting benchmark run $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p "long121-raw-shard-*" -D long121_artifacts
      - name: Assemble the complete 121-row table from raw checked measurements
        run: |
          python compression_lab/benchmark_long_121_20261024.py \
            --merge long121_artifacts --output consolidated_long_121
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('consolidated_long_121/SUMMARY.json').read_text())
          print(json.dumps(data,indent=2))
          # Fail this step if the full 121 profiles were not successfully
          # measured; evidence artifact still uploads because if: always().
          if not data['full_benchmark_complete']:
              raise SystemExit('INCOMPLETE: benchmark preserved; do not claim 121/121 PASS')
          PY
      - name: Preserve raw measurements, summary and single complete table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGY_WORLD_LONG121_CONSOLIDATED
          path: |
            consolidated_long_121/
            long121_artifacts/
          if-no-files-found: warn
          retention-days: 90
