name: SHTENCO Archiver V4 Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r compression_lab/requirements_v4.txt

      - name: Compile source
        run: |
          python -m py_compile \
            compression_lab/egd256_web_app_v3.py \
            compression_lab/umc256_engine.py \
            compression_lab/benchmark_v4.py

      - name: Unit tests
        run: python -m pytest -q compression_lab/test_umc256_engine.py

      - name: Self-test 35 registered engines
        run: python compression_lab/egd256_web_app_v3.py --self-test

      - name: Real V4 benchmark
        run: |
          mkdir -p compression_lab/output_v4
          python compression_lab/benchmark_v4.py \
            --size 65536 \
            --output compression_lab/output_v4 | tee compression_lab/output_v4/benchmark_console.log

      - name: Full 35-engine diagnostic benchmark
        run: |
          python compression_lab/egd256_web_app_v3.py \
            --benchmark \
            --benchmark-size 8192 \
            --report compression_lab/output_v4/benchmark_35_engines.json \
            --csv compression_lab/output_v4/benchmark_35_engines.csv \
            | tee compression_lab/output_v4/benchmark_35_console.log

      - name: Build final package
        run: |
          mkdir -p dist/SHTENCO_ARCHIVER_V4_UMC256
          cp compression_lab/egd256_web_app_v3.py dist/SHTENCO_ARCHIVER_V4_UMC256/
          cp compression_lab/umc256_engine.py dist/SHTENCO_ARCHIVER_V4_UMC256/
          cp compression_lab/benchmark_v4.py dist/SHTENCO_ARCHIVER_V4_UMC256/
          cp compression_lab/requirements_v4.txt dist/SHTENCO_ARCHIVER_V4_UMC256/requirements.txt
          cp -r compression_lab/output_v4 dist/SHTENCO_ARCHIVER_V4_UMC256/results
          cp compression_lab/README_V4.md dist/SHTENCO_ARCHIVER_V4_UMC256/README.md
          cd dist
          zip -r -9 SHTENCO_ARCHIVER_V4_UMC256_FULL.zip SHTENCO_ARCHIVER_V4_UMC256
          sha256sum SHTENCO_ARCHIVER_V4_UMC256_FULL.zip > SHA256SUMS.txt

      - name: Upload complete archive and reports
        uses: actions/upload-artifact@v4
        with:
          name: SHTENCO_ARCHIVER_V4_UMC256_FULL
          path: |
            dist/SHTENCO_ARCHIVER_V4_UMC256_FULL.zip
            dist/SHA256SUMS.txt
            compression_lab/output_v4/
          if-no-files-found: error
          retention-days: 30
