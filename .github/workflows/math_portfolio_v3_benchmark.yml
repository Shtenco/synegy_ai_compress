name: SHTENCO Math Portfolio v3 benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-portfolio-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: compression_lab
    steps:
      - name: Checkout AI Compress
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r compression_lab/requirements_v4.txt
      - name: Compile Math Portfolio and integration modules
        run: |
          python -m py_compile \
            compression_lab/shtenco_math_portfolio_v3.py \
            compression_lab/shtenco_tier1_v2.py \
            compression_lab/shtenco_tier1_v21.py \
            compression_lab/benchmark_math_portfolio_v3.py
      - name: Exact unit and corruption tests
        run: |
          python -m pytest -q compression_lab/test_math_portfolio_v3.py
      - name: Run deterministic applicability benchmark
        run: |
          set -o pipefail
          rm -rf compression_lab/output_math_portfolio_v3
          python compression_lab/benchmark_math_portfolio_v3.py \
            --size 32768 \
            --output compression_lab/output_math_portfolio_v3 \
            2>&1 | tee compression_lab/output_math_portfolio_v3_console.log
      - name: Enforce exactness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('compression_lab/output_math_portfolio_v3/MATH_V3_REPORT.json')
          if not path.exists():
              raise SystemExit('Math v3 report missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          for engine, row in report['summary'].items():
              print(engine, row)
              if row['pass_rows'] != row['row_count']:
                  raise SystemExit(f'exactness failure in {engine}')
          max_row = report['summary']['SHTENCO MATH PORTFOLIO V3 MAX']
          baseline = report['summary']['LZMA9_EXTREME']
          if max_row['total_bytes'] >= baseline['total_bytes']:
              raise SystemExit('Math v3 did not beat LZMA9 on its controlled applicability suite')
          PY
      - name: Package reproducibility artifact
        if: always()
        run: |
          mkdir -p dist/SHTENCO_MATH_PORTFOLIO_V3
          cp compression_lab/shtenco_math_portfolio_v3.py dist/SHTENCO_MATH_PORTFOLIO_V3/
          cp compression_lab/benchmark_math_portfolio_v3.py dist/SHTENCO_MATH_PORTFOLIO_V3/
          cp compression_lab/test_math_portfolio_v3.py dist/SHTENCO_MATH_PORTFOLIO_V3/
          cp compression_lab/README_MATH_PORTFOLIO_V3.md dist/SHTENCO_MATH_PORTFOLIO_V3/
          cp -r compression_lab/output_math_portfolio_v3 dist/SHTENCO_MATH_PORTFOLIO_V3/results
          cp compression_lab/output_math_portfolio_v3_console.log dist/SHTENCO_MATH_PORTFOLIO_V3/
          cd dist
          zip -r -9 SHTENCO_MATH_PORTFOLIO_V3_FULL_ARTIFACT.zip SHTENCO_MATH_PORTFOLIO_V3
          sha256sum SHTENCO_MATH_PORTFOLIO_V3_FULL_ARTIFACT.zip > SHA256SUMS_MATH_V3.txt
      - name: Upload Math Portfolio artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHTENCO_MATH_PORTFOLIO_V3_FULL_ARTIFACT
          path: |
            dist/SHTENCO_MATH_PORTFOLIO_V3_FULL_ARTIFACT.zip
            dist/SHA256SUMS_MATH_V3.txt
            compression_lab/output_math_portfolio_v3/
          if-no-files-found: error
          retention-days: 30
