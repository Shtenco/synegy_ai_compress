name: SHTENCO AI Compress smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1-roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt
      - run: python -m pip install -r compression_lab/requirements_v4.txt
      - name: Compile active compression engines
        run: |
          python -m py_compile \
            compression_lab/gabriel_horn_engine.py \
            compression_lab/shtenco_tier1_engines.py \
            compression_lab/umd_selector.py
      - name: Exact round-trip, random-access and corruption tests
        run: |
          python -m pytest -q \
            compression_lab/test_tier1_engines.py \
            compression_lab/test_gabriel_horn_engine.py
