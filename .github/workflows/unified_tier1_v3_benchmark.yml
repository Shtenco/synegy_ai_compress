name: Unified SHTENCO Tier-1 v3 81-system benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-tier1-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: compression_lab
    steps:
      - name: Checkout AI Compress
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r compression_lab/requirements_v4.txt
      - name: Compile all active benchmark engines
        run: |
          python -m py_compile \
            compression_lab/gabriel_horn_engine.py \
            compression_lab/shtenco_tier1_engines.py \
            compression_lab/shtenco_tier1_v2.py \
            compression_lab/shtenco_tier1_v21.py \
            compression_lab/shtenco_math_portfolio_v3.py \
            compression_lab/frozen_tier1_summary.py \
            compression_lab/historical_tier1_corpus.py \
            compression_lab/benchmark_unified_tier1.py \
            compression_lab/benchmark_unified_tier1_v3.py
      - name: Exact unit, random-access, corruption and Math tests
        run: |
          python -m pytest -q \
            compression_lab/test_gabriel_horn_engine.py \
            compression_lab/test_tier1_engines.py \
            compression_lab/test_tier1_v2.py \
            compression_lab/test_math_portfolio_v3.py
      - name: Run federated 81-system benchmark
        run: |
          set -o pipefail
          rm -rf compression_lab/output_unified_tier1_v3
          mkdir -p compression_lab/output_unified_tier1_v3
          python compression_lab/benchmark_unified_tier1_v3.py \
            --size 32768 \
            --repeats 3 \
            --output compression_lab/output_unified_tier1_v3 \
            2>&1 | tee compression_lab/output_unified_tier1_v3/benchmark_console.log
      - name: Enforce 81-system inventory and exactness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('compression_lab/output_unified_tier1_v3/UNIFIED_TIER1_POSITIONS.json')
          if not path.exists():
              raise SystemExit('81-system positions report missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          print('systems', report['system_count'], 'current rows', report['current_row_count'],
                'current pass', report['current_pass_rows'])
          if report['system_count'] < 81:
              raise SystemExit(f"expanded inventory incomplete: {report['system_count']} < 81")
          if report['current_pass_rows'] != report['current_row_count']:
              raise SystemExit('at least one active benchmark row failed exactness')
          names = {item['engine'] for item in report['combined_ratio']}
          required = {
              'SHTENCO MATH PORTFOLIO V3 BALANCED',
              'SHTENCO MATH PORTFOLIO V3 MAX',
              'SHTENCO OMNIA-MATH V3 SPEED',
              'SHTENCO OMNIA-MATH V3 BALANCED',
              'SHTENCO OMNIA-MATH V3 MAX',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'Math v3 engines missing from ranking: {sorted(missing)}')
          if not any(item['engine'].startswith('SHTENCO') for item in report['combined_ratio'][:5]):
              raise SystemExit('no SHTENCO engine in combined ratio TOP-5')
          if not any(item['engine'].startswith('SHTENCO') for item in report['current_score'][:5]):
              raise SystemExit('no SHTENCO engine in current score TOP-5')
          if not any(item['engine'].startswith('SHTENCO') for item in report['frozen_score'][:5]):
              raise SystemExit('frozen 69-system score TOP-5 integrity lost')
          PY
      - name: Record immutable provenance
        if: always()
        run: |
          mkdir -p compression_lab/output_unified_tier1_v3
          {
            echo 'legacy_snapshot=c681ec94fe5194156b71fc304035f7aaff4d2327'
            echo 'legacy_artifact_sha256=bb769fa6c1b65d697e66d79ac3275b1715ee0c77186669377e783734fcc47296'
            echo "ai_compress_commit=$(git rev-parse HEAD)"
            echo "workflow_commit=${GITHUB_SHA}"
          } > compression_lab/output_unified_tier1_v3/SOURCE_COMMITS.txt
      - name: Package full 81-system reproducibility artifact
        if: always()
        run: |
          mkdir -p dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS
          cp compression_lab/shtenco_tier1_engines.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/shtenco_tier1_v2.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/shtenco_tier1_v21.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/shtenco_math_portfolio_v3.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/gabriel_horn_engine.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/frozen_tier1_summary.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/historical_tier1_corpus.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/benchmark_unified_tier1.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/benchmark_unified_tier1_v3.py dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp compression_lab/README_MATH_PORTFOLIO_V3.md dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/
          cp -r compression_lab/output_unified_tier1_v3 dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS/results
          cd dist
          zip -r -9 SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS_FULL_ARTIFACT.zip SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS
          sha256sum SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS_FULL_ARTIFACT.zip > SHA256SUMS_UNIFIED_TIER1_V3.txt
      - name: Upload 81-system benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS_FULL_ARTIFACT
          path: |
            dist/SHTENCO_UNIFIED_TIER1_V3_81_SYSTEMS_FULL_ARTIFACT.zip
            dist/SHA256SUMS_UNIFIED_TIER1_V3.txt
            compression_lab/output_unified_tier1_v3/
          if-no-files-found: error
          retention-days: 30
