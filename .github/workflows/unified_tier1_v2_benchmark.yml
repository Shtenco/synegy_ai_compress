name: Unified SHTENCO Tier-1 v2 benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout AI Compress
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: compression_lab/requirements_v4.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r compression_lab/requirements_v4.txt
      - name: Compile autonomous benchmark and engines
        run: |
          python -m py_compile \
            compression_lab/gabriel_horn_engine.py \
            compression_lab/shtenco_tier1_engines.py \
            compression_lab/shtenco_tier1_v2.py \
            compression_lab/shtenco_tier1_v21.py \
            compression_lab/frozen_tier1_summary.py \
            compression_lab/historical_tier1_corpus.py \
            compression_lab/benchmark_unified_tier1.py
      - name: Exact unit, random-access and corruption tests
        run: |
          python -m pytest -q \
            compression_lab/test_gabriel_horn_engine.py \
            compression_lab/test_tier1_engines.py \
            compression_lab/test_tier1_v2.py
      - name: Rerun current Tier-1 engines and federate 76-system ranking
        run: |
          set -o pipefail
          rm -rf compression_lab/output_unified_tier1_v2
          mkdir -p compression_lab/output_unified_tier1_v2
          python compression_lab/benchmark_unified_tier1.py \
            --size 32768 \
            --repeats 3 \
            --output compression_lab/output_unified_tier1_v2 \
            2>&1 | tee compression_lab/output_unified_tier1_v2/benchmark_console.log
      - name: Enforce exactness and Tier-1 targets
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('compression_lab/output_unified_tier1_v2/UNIFIED_TIER1_POSITIONS.json')
          if not path.exists():
              raise SystemExit('unified positions report missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          print('systems', report['system_count'], 'current rows', report['current_row_count'],
                'current pass', report['current_pass_rows'])
          if report['system_count'] < 76:
              raise SystemExit('historical/current system inventory is incomplete')
          if report['current_pass_rows'] != report['current_row_count']:
              raise SystemExit('at least one current exact benchmark row failed')
          if not any(item['engine'].startswith('SHTENCO') for item in report['combined_ratio'][:5]):
              raise SystemExit('no SHTENCO production engine in ratio TOP-5')
          if not any(item['engine'].startswith('SHTENCO') for item in report['current_score'][:5]):
              raise SystemExit('no SHTENCO production engine in current score TOP-5')
          if not any(item['engine'].startswith('SHTENCO') for item in report['frozen_score'][:5]):
              raise SystemExit('frozen full benchmark lost SHTENCO score TOP-5')
          PY
      - name: Record immutable sources
        if: always()
        run: |
          mkdir -p compression_lab/output_unified_tier1_v2
          {
            echo 'legacy_snapshot=c681ec94fe5194156b71fc304035f7aaff4d2327'
            echo 'legacy_artifact_sha256=bb769fa6c1b65d697e66d79ac3275b1715ee0c77186669377e783734fcc47296'
            echo "ai_compress_commit=$(git rev-parse HEAD)"
            echo "workflow_commit=${GITHUB_SHA}"
          } > compression_lab/output_unified_tier1_v2/SOURCE_COMMITS.txt
      - name: Package full reproducibility artifact
        if: always()
        run: |
          mkdir -p dist/SHTENCO_UNIFIED_TIER1_V2
          cp compression_lab/shtenco_tier1_engines.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/shtenco_tier1_v2.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/shtenco_tier1_v21.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/gabriel_horn_engine.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/frozen_tier1_summary.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/historical_tier1_corpus.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/benchmark_unified_tier1.py dist/SHTENCO_UNIFIED_TIER1_V2/
          cp compression_lab/TIER1_V2_TECHNOLOGY_INVENTORY.md dist/SHTENCO_UNIFIED_TIER1_V2/
          cp -r compression_lab/output_unified_tier1_v2 dist/SHTENCO_UNIFIED_TIER1_V2/results
          cd dist
          zip -r -9 SHTENCO_UNIFIED_TIER1_V2_FULL_ARTIFACT.zip SHTENCO_UNIFIED_TIER1_V2
          sha256sum SHTENCO_UNIFIED_TIER1_V2_FULL_ARTIFACT.zip > SHA256SUMS_UNIFIED_TIER1_V2.txt
      - name: Upload unified benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SHTENCO_UNIFIED_TIER1_V2_FULL_ARTIFACT
          path: |
            dist/SHTENCO_UNIFIED_TIER1_V2_FULL_ARTIFACT.zip
            dist/SHA256SUMS_UNIFIED_TIER1_V2.txt
            compression_lab/output_unified_tier1_v2/
          if-no-files-found: error
          retention-days: 30
